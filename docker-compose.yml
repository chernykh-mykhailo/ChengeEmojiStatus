services:
  emoji-rotator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg-emoji-rotator
    restart: unless-stopped
    ports:
      # Ззовні 3090 (бо 3000 зайнятий drawshare), всередині 3000
      - "3090:3000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL}
      - PORT=3000
      - DB_PATH=/app/data/bot.db
      - APP_TIMEZONE=${APP_TIMEZONE:-Europe/Kyiv}
    volumes:
      - ./data:/app/data
